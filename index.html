// ------------------- utils -------------------
function shuffle<T>(arr: T[]): T[] {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function sample<T>(arr: T[], n: number): T[] { return shuffle(arr).slice(0, n); }

// ------------------- data/quiz.ts -------------------
function buildQuestions(words: Word[], soundOn: boolean): QuizQuestion[] {
  const speechOk = Speech.supported && soundOn;
  const types: QuizType[] = ['picture', 'word', 'listen', 'translate', 'complete'];
  return shuffle(words).map((w, i) => {
    let type = types[i % types.length];
    if (type === 'listen' && !speechOk) type = 'picture';
    const options = shuffle([w, ...sample(words.filter(x => x.id !== w.id), 2)]);
    return { word: w, type, options };
  });
}

// ------------------- services/progressStore.ts -------------------
const STORAGE_KEY = 'mf100_progress_v1';
function defaultCategoryProgress(): CategoryProgress {
  return { wordsLearned: [], lessonStars: 0, quizCompleted: false, quizBestScore: 0, quizStars: 0, badge: false, completed: false };
}
function defaultProgress(): AppProgress {
  return { version: 1, categories: { animals: defaultCategoryProgress() }, soundOn: true };
}
const progressStore = {
  load(): AppProgress {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultProgress();
      const p = JSON.parse(raw);
      const base = defaultProgress();
      const animals = { ...defaultCategoryProgress(), ...((p.categories && p.categories.animals) || {}) };
      return { ...base, ...p, categories: { ...base.categories, ...(p.categories || {}), animals } };
    } catch { return defaultProgress(); }
  },
  save(p: AppProgress): void {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch {}
  },
};

// ------------------- services/sfx.ts (Stage 3) -------------------
const Sfx = {
  ctx: null as AudioContext | null,
  master: null as GainNode | null,
  enabled: true,
  ensure(): AudioContext | null {
    if (!this.ctx) {
      const AC = (window as any).AudioContext || (window as any).webkitAudioContext;
      if (AC) { try { this.ctx = new AC(); } catch { return null; } }
    }
    if (this.ctx && !this.master) {
      try { this.master = this.ctx.createGain(); this.master.gain.value = 0.9; this.master.connect(this.ctx.destination); } catch {}
    }
    if (this.ctx && this.ctx.state === 'suspended' && this.ctx.resume) {
      try { this.ctx.resume(); } catch {}
    }
    return this.ctx;
  },
  tone(freq: number, start: number, dur: number, type: string, vol: number) {
    const ctx = this.ensure(); if (!ctx || !this.master) return;
    try {
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = type; o.frequency.value = freq;
      const t0 = ctx.currentTime + start;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(this.master);
      o.start(t0); o.stop(t0 + dur + 0.05);
    } catch {}
  },
  tap() { if (!this.enabled) return; this.tone(640, 0, .05, 'sine', .05); },
  correct() {
    if (!this.enabled) return;
    this.tone(523.25, 0, .12, 'triangle', .13);
    this.tone(659.25, .09, .12, 'triangle', .13);
    this.tone(783.99, .18, .22, 'triangle', .13);
    this.tone(1567.98, .24, .12, 'sine', .04);
  },
  star() {
    if (!this.enabled) return;
    this.tone(659.25, 0, .1, 'triangle', .12);
    this.tone(880, .08, .1, 'triangle', .12);
    this.tone(1318.5, .16, .3, 'triangle', .12);
  },
  retry() {
    if (!this.enabled) return;
    this.tone(392, 0, .16, 'sine', .06);
    this.tone(329.63, .11, .2, 'sine', .06);
  },
  fanfare() {
    if (!this.enabled) return;
    this.tone(392, 0, .15, 'triangle', .12);
    this.tone(523.25, .12, .15, 'triangle', .12);
    this.tone(659.25, .24, .15, 'triangle', .12);
    this.tone(783.99, .36, .5, 'triangle', .13);
    this.tone(523.25, .36, .5, 'triangle', .09);
    this.tone(659.25, .36, .5, 'triangle', .09);
    this.tone(1046.5, .52, .25, 'sine', .05);
    this.tone(1318.5, .6, .3, 'sine', .05);
  },
};

// ------------------- services/speech.ts (Stage 3 pipeline) -------------------
type TrackItem =
  | { kind: 'tts'; text: string; rate?: number }
  | { kind: 'file'; url: string; fallbackText?: string; fallbackRate?: number };

const Speech = {
  supported: typeof window !== 'undefined' && 'speechSynthesis' in window,
  voice: null as SpeechSynthesisVoice | null,
  _playing: false,
  _subs: new Set<(v: boolean) => void>(),
  _seq: 0,
  _fileAudio: null as HTMLAudioElement | null,
  _fileFinish: null as (() => void) | null,
  get playing(): boolean { return this._playing; },
  _set(v: boolean) {
    if (this._playing !== v) { this._playing = v; this._subs.forEach(f => f(v)); }
  },
  subscribe(fn: (v: boolean) => void): () => void {
    this._subs.add(fn);
    return () => { this._subs.delete(fn); };
  },
  init() {
    if (!this.supported) return;
    const pick = () => { this.voice = this._pickBest(); };
    pick();
    window.speechSynthesis.onvoiceschanged = pick;
  },
  _pickBest(): SpeechSynthesisVoice | null {
    if (!this.supported) return null;
    let vs: SpeechSynthesisVoice[] = [];
    try { vs = window.speechSynthesis.getVoices(); } catch { return null; }
    const en = vs.filter(v => /^en([-_]|$)/i.test(v.lang));
    if (!en.length) return null;
    const score = (v: SpeechSynthesisVoice) => {
      const n = v.name.toLowerCase(); let s = 0;
      if (/natural|neural/.test(n)) s += 8;
      if (/google (us|uk) english/.test(n)) s += 7;
      if (/samantha/.test(n)) s += 6;
      if (/microsoft (aria|jenny|guy|ana)/.test(n)) s += 5;
      if (/karen|moira|tessa|serena/.test(n)) s += 4;
      if (/zira|david|mark/.test(n)) s += 3;
      if (/english/.test(n)) s += 1;
      return s;
    };
    let best = en[0];
    for (const v of en) if (score(v) > score(best)) best = v;
    return best;
  },
  cancel() {
    this._seq++;
    if (this._fileAudio) {
      try { this._fileAudio.pause(); } catch {}
      try { (this._fileAudio as HTMLAudioElement).src = ''; } catch {}
    }
    if (this._fileFinish) { const f = this._fileFinish; this._fileFinish = null; f(); }
    if (this.supported) { try { window.speechSynthesis.cancel(); } catch {} }
    this._set(false);
  },
  _playFile(url: string, seq: number): Promise<boolean> {
    return new Promise(resolve => {
      let done = false;
      const finish = (ok: boolean) => {
        if (done) return; done = true;
        this._fileAudio = null; this._fileFinish = null;
        resolve(ok);
      };
      try {
        const el = new Audio(url);
        this._fileAudio = el; this._fileFinish = () => finish(false);
        el.onended = () => finish(true);
        el.onerror = () => finish(false);
        el.onplay = () => { if (seq === this._seq) this._set(true); };
        el.play().catch(() => finish(false));
      } catch { finish(false); }
    });
  },
  _speakOne(item: { text: string; rate?: number }, seq: number): Promise<void> {
    return new Promise(resolve => {
      if (!this.supported || seq !== this._seq) return resolve();
      let done = false; let timer = 0;
      const finish = () => { if (done) return; done = true; if (timer) window.clearTimeout(timer); resolve(); };
      try {
        const u = new SpeechSynthesisUtterance(item.text);
        if (this.voice) u.voice = this.voice;
        u.lang = this.voice ? this.voice.lang : 'en-US';
        u.rate = item.rate != null ? item.rate : 0.85;
        u.pitch = 1.05;
        u.onend = finish; u.onerror = finish;
        timer = window.setTimeout(finish, Math.max(2500, item.text.length * 150));
        window.speechSynthesis.speak(u);
      } catch { finish(); }
    });
  },
  async _run(track: TrackItem[], seq: number) {
    for (const item of track) {
      if (seq !== this._seq) return;
      if (item.kind === 'file') {
        const ok = await this._playFile(item.url, seq);
        if (seq !== this._seq) return;
        if (!ok && item.fallbackText && this.supported) {
          await this._speakOne({ text: item.fallbackText, rate: item.fallbackRate }, seq);
        }
      } else {
        await this._speakOne(item, seq);
      }
    }
    if (seq === this._seq) this._set(false);
  },
  play(track: TrackItem[]): boolean {
    if (!track.length) return false;
    const hasFile = track.some(t => t.kind === 'file');
    if (!this.supported && !hasFile) return false;
    this.cancel();
    const seq = ++this._seq;
    this._set(true);
    window.setTimeout(() => { if (seq === this._seq) this._run(track, seq); }, 50);
    return true;
  },
  speak(text: string, opts: { rate?: number } = {}): boolean {
    return this.play([{ kind: 'tts', text, rate: opts.rate }]);
  },
  sayWord(word: Word): boolean {
    const track: TrackItem[] = word.audioUrl
      ? [{ kind: 'file', url: word.audioUrl, fallbackText: word.english, fallbackRate: 0.72 }]
      : [{ kind: 'tts', text: word.english, rate: 0.72 }];
    return this.play(track);
  },
  sayWordAndSentence(word: Word): boolean {
    const track: TrackItem[] = [];
    if (word.audioUrl) track.push({ kind: 'file', url: word.audioUrl, fallbackText: word.english, fallbackRate: 0.72 });
    else track.push({ kind: 'tts', text: word.english, rate: 0.72 });
    if (word.sentenceAudioUrl) track.push({ kind: 'file', url: word.sentenceAudioUrl, fallbackText: word.sentence, fallbackRate: 0.86 });
    else track.push({ kind: 'tts', text: word.sentence, rate: 0.86 });
    return this.play(track);
  },
};
function useSpeechPlaying(): boolean {
  const [playing, setPlaying] = useState(Speech.playing);
  useEffect(() => Speech.subscribe(setPlaying), []);
  return playing;
}
function prefersReducedMotion(): boolean {
  try { return !!window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  catch { return false; }
}

function FlyingStar({ flight, onDone }: { flight: Flight; onDone: () => void }) {
  const ref = useRef<HTMLDivElement | null>(null);

    const finish = () => {
      if (doneRef.current) return;
      doneRef.current = true;
      onDone();
    };
    const el = ref.current;
    let fallback = 0;
    if (el && typeof (el as any).animate === 'function') {
      const dx = flight.to.x - flight.from.x;
      const dy = flight.to.y - flight.from.y;
      const anim = (el as any).animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1 },
        { transform: `translate(${dx * 0.45}px, ${dy * 0.45 - 80}px) scale(1.15)`, opacity: 1, offset: 0.5 },
        { transform: `translate(${dx}px, ${dy}px) scale(0.4)`, opacity: 0.9 },
      ], { duration: 800, easing: 'cubic-bezier(.5,.05,.6,1)' });
      anim.onfinish = finish;
      fallback = window.setTimeout(finish, 1500);
    } else {
      fallback = window.setTimeout(finish, 700);
    }
    return () => { window.clearTimeout(fallback); finish(); };
  }, []);
  return (
    <div ref={ref} aria-hidden="true" className="fixed z-[70] pointer-events-none"
      style={{ left: flight.from.x - 26, top: flight.from.y - 26 }}>

  );

function Confetti() {
  const canvasRef = useRef<HTMLCanvasElement | null>(null);
  useEffect(() => {
    const canvas = canvasRef.current; if (!canvas) return;
    const ctx = canvas.getContext('2d'); if (!ctx) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = () => canvas.getBoundingClientRect();
    const resize = () => {
      canvas.width = rect().width * dpr; canvas.height = rect().height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize(); window.addEventListener('resize', resize);
    const colors = ['#FF8A3D', '#FFC93C', '#5BBA6F', '#3FA8B8', '#F4A9B8', '#FF6B6B'];
    const parts = Array.from({ length: 90 }).map(() => ({
      x: rect().width * Math.random(), y: -20 - rect().height * Math.random() * 0.6,
      w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
      vy: 1.6 + Math.random() * 2.4, vx: -1 + Math.random() * 2,
      rot: Math.random() * Math.PI, vr: -0.1 + Math.random() * 0.2,
      color: colors[Math.floor(Math.random() * colors.length)],
    }));
    let raf = 0; const start = performance.now();
    const tick = (t: number) => {
      const el = t - start;
      const W = rect().width, H = rect().height;
      ctx.clearRect(0, 0, W, H);
      const fade = el > 3200 ? Math.max(0, 1 - (el - 3200) / 800) : 1;
      parts.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        if (p.y > H + 30) { p.y = -20; p.x = W * Math.random(); }
        ctx.save(); ctx.globalAlpha = fade; ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color; ctx.beginPath();
        if ((ctx as any).roundRect) (ctx as any).roundRect(-p.w / 2, -p.h / 2, p.w, p.h, 2);
        else ctx.rect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.fill(); ctx.restore();
      });
      if (el < 4000) raf = requestAnimationFrame(tick); else ctx.clearRect(0, 0, W, H);
    };
    raf = requestAnimationFrame(tick);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  }, []);
  return <canvas ref={canvasRef} className="pointer-events-none absolute inset-0 w-full h-full z-10" />;
}

function LessonScreen({ words, learnedIds, quizDone, soundOn, sayWord, sayWordAndSentence, onBack, onWordComplete, onFinish }: {
  words: Word[]; learnedIds: string[]; quizDone: boolean; soundOn: boolean;
  sayWord: (w: Word) => boolean; sayWordAndSentence: (w: Word) => boolean;
  onBack: () => void; onWordComplete: (id: string) => void; onFinish: (target: 'quiz' | 'map') => void;
}) {
  const firstUnlearned = words.findIndex(w => !learnedIds.includes(w.id));
  const review = firstUnlearned === -1;
  const [index, setIndex] = useState(() => (review ? 0 : Math.max(0, firstUnlearned)));
  const [phase, setPhase] = useState<'learn' | 'repeat' | 'play' | 'win'>('learn');
  const [listened, setListened] = useState(false);
  const [options, setOptions] = useState<Word[]>([]);
  const [wrongPicks, setWrongPicks] = useState<string[]>([]);
  const [correctFlash, setCorrectFlash] = useState<string | null>(null);
  const [askExit, setAskExit] = useState(false);
  const [flight, setFlight] = useState<Flight | null>(null);
  const starRef = useRef<HTMLDivElement | null>(null);
  const playing = useSpeechPlaying();
  const reduceMotion = useRef(prefersReducedMotion()).current;
  const word = words[index];
  const isLast = index === words.length - 1;
  const rawPlayType = index % 3;
  const playType = rawPlayType === 2 && !(Speech.supported && soundOn) ? 0 : rawPlayType;
  const stepActive = phase === 'learn' ? 1 : phase === 'repeat' ? 2 : phase === 'play' ? 3 : 4;

  useEffect(() => {
    setPhase('learn'); setListened(false); setWrongPicks([]); setCorrectFlash(null); setFlight(null);
    setOptions(shuffle([words[index], ...sample(words.filter(w => w.id !== words[index].id), 2)]));
  }, [index]);

  useEffect(() => {
    if (phase === 'play' && playType === 2 && soundOn) {
      const t = window.setTimeout(() => { Speech.sayWord(word); }, 400);
      return () => window.clearTimeout(t);
    }
  }, [phase, index]);

  const handleListen = () => {
    setListened(true);
    sayWordAndSentence(word);
  };
  const handlePick = (opt: Word, e?: any) => {
    if (correctFlash) return;
    const fromEl = e ? e.currentTarget as HTMLElement : null;
    if (opt.id === word.id) {
      setCorrectFlash(opt.id);
      Sfx.correct();
      window.setTimeout(() => {
        const toEl = starRef.current;
        if (!reduceMotion && fromEl && toEl) {
          const f = fromEl.getBoundingClientRect();
          const t = toEl.getBoundingClientRect();
          if (f.width && t.width) {
            setFlight({ from: { x: f.left + f.width / 2, y: f.top + f.height / 2 }, to: { x: t.left + t.width / 2, y: t.top + t.height / 2 } });
            return;
          }
        }
        onWordComplete(word.id);
        setPhase('win');
      }, 600);
    } else {
      setWrongPicks(w => (w.includes(opt.id) ? w : [...w, opt.id]));
      Sfx.retry();
    }
  };
  const starLanded = () => {
    setFlight(null);
    Sfx.star();
    onWordComplete(word.id);
    setPhase('win');
  };
  const hootMsg: string | null =
    correctFlash || phase === 'win' ? (index % 2 === 0 ? 'Great job! ⭐' : 'Excellent! 🎉')
    : phase === 'learn' && index === 0 ? 'Listen carefully! 👂'
    : phase === 'repeat' && index === 0 ? 'Your turn!'
    : phase === 'play' && wrongPicks.length ? 'Try again! 💪'
    : null;
  const hootExpr: HootExpr = (correctFlash || phase === 'win') ? 'happy' : (phase === 'play' && !hootMsg) ? 'think' : 'normal';

  return (
    <div className="mx-auto w-full max-w-md px-5 py-4 pb-[calc(2rem+env(safe-area-inset-bottom))] min-h-screen flex flex-col">
      <div className="flex items-center justify-between gap-2">
        <BackButton onClick={() => setAskExit(true)} />
        <div className="flex-1 flex flex-col items-center">
          <div className="flex items-center gap-1 text-[10px] font-extrabold tracking-[0.16em] text-softink">
            <IconPaw className="w-3.5 h-3.5 text-orange" /><span>ANIMALS</span>
          </div>
          <div className="mt-1"><ProgressDots total={words.length} current={index} isLearned={i => learnedIds.includes(words[i].id)} /></div>
          <span className="text-xs font-extrabold text-softink mt-1 tracking-wide">{index + 1} / {words.length}</span>
        </div>
        <div ref={starRef} className="h-11 px-3 rounded-full bg-yellow-soft flex items-center gap-1.5 shrink-0">
          <span key={learnedIds.length} className="anim-star inline-flex text-[#E3A81E]"><IconStar className="w-5 h-5" /></span>
          <span className="font-extrabold text-ink text-lg leading-none">{learnedIds.length}</span>
        </div>
      </div>
      <div className="mt-3"><StepTrail active={stepActive} /></div>
      <div className="mt-2"><HootBar message={hootMsg} expression={hootExpr} /></div>
      <div className="flex-1 flex flex-col justify-center mt-3">
        {phase !== 'play' ? (
          <div key={word.id} className="anim-pop"><WordCard word={word} compact={phase !== 'learn'} learned={learnedIds.includes(word.id)} /></div>
        ) : (
          <div key={'play' + index} className="bg-white rounded-[2rem] shadow-card p-5 anim-pop">
            {playType === 0 && (
              <>
                <h2 className="text-center text-[1.6rem] font-extrabold text-ink leading-snug">Where is the <span className="text-orange-dark">{word.english}</span>?</h2>
                <p dir="rtl" className="text-center font-ar text-lg font-bold text-softink mt-0.5">اختار الصورة الصحيحة!</p>
                <PicOptions options={options} correctId={correctFlash} wrong={wrongPicks} onPick={handlePick} />
              </>
            )}
            {playType === 1 && (
              <>
                <h2 className="text-center text-[1.6rem] font-extrabold text-ink leading-snug">Which word is this?</h2>
                <p dir="rtl" className="text-center font-ar text-lg font-bold text-softink mt-0.5">اختار الكلمة الصحيحة!</p>
                <AnimalArt id={word.id} className="w-36 h-36 mx-auto mt-3" />
                <WordOptions options={options} correctId={correctFlash} wrong={wrongPicks} onPick={handlePick} />
              </>
            )}
            {playType === 2 && (
              <>
                <h2 className="text-center text-[1.6rem] font-extrabold text-ink leading-snug">Listen and choose!</h2>
                <p dir="rtl" className="text-center font-ar text-lg font-bold text-softink mt-0.5">استمع واختار!</p>
                <button onClick={() => sayWord(word)} aria-label="Play the word again"
                  className="relative mx-auto mt-3 w-24 h-24 rounded-full bg-teal text-white shadow-[0_6px_0_#2E8A99] active:translate-y-1.5 active:shadow-[0_2px_0_#2E8A99] transition-all grid place-items-center">
                  {playing && (<>
                    <span className="wave-ring-t" />
                    <span className="wave-ring-t" style={{ animationDelay: '.5s' }} />
                  </>)}
                  <IconSpeaker className={`w-11 h-11 ${playing ? 'anim-pulse-soft' : ''}`} />
                </button>
                <PicOptions options={options} correctId={correctFlash} wrong={wrongPicks} onPick={handlePick} />
              </>
            )}
          </div>
        )}
        <div className="mt-4">
          {phase === 'learn' && (
            <div className="flex flex-col items-center gap-4">
              <ListenHero playing={playing} listened={listened} onListen={handleListen} />
              {listened && (
                <BigButton color="green" size="lg" className="w-full anim-pulse-soft" onClick={() => { Speech.cancel(); setPhase('repeat'); }}>
                  Your turn! <IconArrowRight className="w-6 h-6" />
                </BigButton>
              )}
            </div>
          )}
          {phase === 'repeat' && <RepeatPanel word={word} onHearAgain={() => sayWord(word)} onDone={() => { Speech.cancel(); setPhase('play'); }} />}
          {phase === 'win' && (
            <WinPanel isLast={isLast} quizDone={quizDone}
              onNext={() => setIndex(index + 1)}
              onQuiz={() => onFinish('quiz')}
              onMap={() => onFinish('map')} />
          )}
        </div>
      </div>
      {flight && <FlyingStar flight={flight} onDone={starLanded} />}
      <ConfirmDialog open={askExit}
        title="Leave the lesson?" titleAr="مغادرة الدرس؟"
        message="Your stars are saved — you can continue anytime!"
        messageAr="نجومك محفوظة — يمكنك المتابعة في أي وقت!"
        primaryLabel="Keep Learning" primaryLabelAr="أكمل الدرس"
        secondaryLabel="Leave" secondaryLabelAr="خروج"
        onPrimary={() => setAskExit(false)}
        onSecondary={onBack} />
    </div>
  );
}

// ------------------- screens/QuizScreen.tsx -------------------
function SentenceBlank({ q, solved }: { q: QuizQuestion; solved: boolean }) {
  const target = q.word.english.toLowerCase();
  const parts = q.word.sentence.split(new RegExp(`(${q.word.english})`, 'i'));
  return (
    <span dir="ltr">
      {parts.map((p, i) =>
        p.toLowerCase() === target
          ? (solved
            ? <span key={i} className="text-green-dark">{p}</span>
            : <span key={i} className="inline-block min-w-[4.5rem] mx-1 border-b-4 border-dashed border-orange align-baseline">{'\u00A0'}</span>)
          : <span key={i}>{p}</span>
      )}
    </span>
  );
}
function QuizScreen({ words, soundOn, sayWord, onBack, onFinish }: {
  words: Word[]; soundOn: boolean; sayWord: (w: Word) => boolean; onBack: () => void; onFinish: (score: number) => void;
}) {
  const [stage, setStage] = useState<'intro' | 'play'>('intro');
  const [questions] = useState<QuizQuestion[]>(() => buildQuestions(words, soundOn));
  const [qi, setQi] = useState(0);
  const [score, setScore] = useState(0);
  const scoreRef = useRef(0);
  const [attempted, setAttempted] = useState(false);
  const [wrong, setWrong] = useState<string[]>([]);
  const [locked, setLocked] = useState(false);
  const [askExit, setAskExit] = useState(false);
  const [flight, setFlight] = useState<Flight | null>(null);
  const starRowRef = useRef<HTMLDivElement | null>(null);
  const playing = useSpeechPlaying();
  const reduceMotion = useRef(prefersReducedMotion()).current;
  const q = questions[qi];

  useEffect(() => {
    if (stage !== 'play' || !q || q.type !== 'listen' || !soundOn) return;
    const t = window.setTimeout(() => { Speech.sayWord(q.word); }, 450);
    return () => window.clearTimeout(t);
  }, [stage, qi]);

  if (stage === 'intro') {
    return (
      <div className="mx-auto w-full max-w-md px-5 py-4 pb-[calc(2rem+env(safe-area-inset-bottom))] min-h-screen flex flex-col">
        <div className="flex justify-start"><BackButton onClick={onBack} /></div>
        <div className="flex-1 flex flex-col items-center justify-center text-center anim-pop px-2">
          <div className="w-28 anim-bob"><HootArt expression="think" className="w-full" /></div>
          <h1 className="text-5xl font-extrabold text-ink mt-4">Quiz Time!</h1>
          <p dir="rtl" className="font-ar text-2xl font-bold text-softink mt-1">وقت الاختبار!</p>
          <div className="bg-white rounded-[2rem] shadow-card p-5 mt-6 w-full max-w-sm space-y-3 text-left">
            <div className="flex items-center gap-3">
              <span className="w-9 h-9 rounded-xl bg-orange-soft grid place-items-center shrink-0"><IconPaw className="w-5 h-5 text-orange" /></span>
              <div className="flex-1">
                <div className="font-extrabold text-ink leading-tight">10 fun questions</div>
                <div dir="rtl" className="font-ar text-sm text-softink font-bold">10 أسئلة ممتعة</div>
              </div>
            </div>
            <div className="flex items-center gap-3">
              <span className="w-9 h-9 rounded-xl bg-yellow-soft grid place-items-center shrink-0"><IconStar className="w-5 h-5 text-[#C9A227]" /></span>
              <div className="flex-1">
                <div className="font-extrabold text-ink leading-tight">A star for every correct answer</div>
                <div dir="rtl" className="font-ar text-sm text-softink font-bold">نجمة مع كل إجابة صحيحة</div>
              </div>
            </div>
            <div className="flex items-center gap-3">
              <span className="w-9 h-9 rounded-xl bg-green-soft grid place-items-center shrink-0"><IconTrophy className="w-5 h-5 text-green" /></span>
              <div className="flex-1">
                <div className="font-extrabold text-ink leading-tight">Win the Animal Explorer award</div>
                <div dir="rtl" className="font-ar text-sm text-softink font-bold">افتح وسام مستكشف الحيوانات</div>
              </div>
            </div>
          </div>
          <BigButton size="lg" className="mt-7 flex-col !gap-0.5" onClick={() => { Sfx.tap(); setStage('play'); }}>
            <span>Start!</span>
            <span dir="rtl" className="font-ar text-xl opacity-90">ابدأ!</span>
          </BigButton>
        </div>
      </div>
    );
  }

  const pick = (opt: Word, e?: any) => {
    if (locked || !q) return;
    const fromEl = e ? e.currentTarget as HTMLElement : null;
    if (opt.id === q.word.id) {
      const gained = !attempted;
      setLocked(true);
      Sfx.correct();
      const land = () => {
        setFlight(null);
        if (gained) { scoreRef.current += 1; setScore(scoreRef.current); Sfx.star(); }
        window.setTimeout(() => {
          if (qi + 1 < questions.length) {
            setQi(qi + 1); setAttempted(false); setWrong([]); setLocked(false);
          } else {
            onFinish(scoreRef.current);
          }
        }, 550);
      };
      window.setTimeout(() => {
        const toEl = starRowRef.current;
        if (gained && !reduceMotion && fromEl && toEl) {
          const f = fromEl.getBoundingClientRect();
          const t = toEl.getBoundingClientRect();
          if (f.width && t.width) {
            setFlight({ from: { x: f.left + f.width / 2, y: f.top + f.height / 2 }, to: { x: t.left + t.width / 2, y: t.top + t.height / 2 } });
            return;
          }
        }
        land();
      }, 500);
    } else {
      setAttempted(true);
      setWrong(w => (w.includes(opt.id) ? w : [...w, opt.id]));
      Sfx.retry();
    }
  };
  const hootMsg = locked ? (qi % 2 === 0 ? 'Great job! ⭐' : 'Excellent! 🎉') : wrong.length ? 'Try again! 💪' : null;

  return (
    <div className="mx-auto w-full max-w-md px-5 py-4 pb-[calc(2rem+env(safe-area-inset-bottom))] min-h-screen flex flex-col">
      <div className="flex items-center gap-3">
        <BackButton onClick={() => setAskExit(true)} />
        <div className="flex-1 text-center min-w-0">
          <div className="text-[11px] font-extrabold tracking-[0.14em] text-softink">QUESTION {qi + 1} OF {questions.length}</div>
          <div ref={starRowRef} className="flex justify-center gap-1 mt-1.5">
            {questions.map((_, i) => {
              const cls = i < score ? 'text-[#E3A81E]' : i === qi ? 'text-[#F0691C] anim-pulse-soft' : 'text-[#EADFC8]';
              return <span key={i} className={`w-5 h-5 ${cls}`}><IconStar className="w-full h-full" /></span>;
            })}
          </div>
        </div>
        <div className="w-11 shrink-0" />
      </div>
      <div className="mt-3"><HootBar message={hootMsg} expression={locked ? 'happy' : 'think'} /></div>
      <div className="flex-1 flex flex-col justify-center" key={qi}>
        {q && q.type === 'picture' && (
          <div className="bg-white rounded-[2rem] shadow-card p-5 anim-pop">
            <h2 className="text-center text-[1.6rem] font-extrabold text-ink leading-snug">Where is the <span className="text-orange-dark">{q.word.english}</span>?</h2>
            <p dir="rtl" className="text-center font-ar text-lg font-bold text-softink mt-0.5">اختار الصورة الصحيحة!</p>
            <PicOptions options={q.options} correctId={locked ? q.word.id : null} wrong={wrong} onPick={pick} />
          </div>
        )}
        {q && q.type === 'word' && (
          <div className="bg-white rounded-[2rem] shadow-card p-5 anim-pop">
            <h2 className="text-center text-[1.6rem] font-extrabold text-ink leading-snug">Which word is this?</h2>
            <p dir="rtl" className="text-center font-ar text-lg font-bold text-softink mt-0.5">اختار الكلمة الصحيحة!</p>
            <AnimalArt id={q.word.id} className="w-36 h-36 mx-auto mt-3" />
            <WordOptions options={q.options} correctId={locked ? q.word.id : null} wrong={wrong} onPick={pick} />
          </div>
        )}
        {q && q.type === 'listen' && (
          <div className="bg-white rounded-[2rem] shadow-card p-5 anim-pop">
            <h2 className="text-center text-[1.6rem] font-extrabold text-ink leading-snug">Listen and choose!</h2>
            <p dir="rtl" className="text-center font-ar text-lg font-bold text-softink mt-0.5">استمع واختار!</p>
            <button onClick={() => sayWord(q.word)} aria-label="Play the word again"
              className="relative mx-auto mt-3 w-24 h-24 rounded-full bg-teal text-white shadow-[0_6px_0_#2E8A99] active:translate-y-1.5 active:shadow-[0_2px_0_#2E8A99] transition-all grid place-items-center">
              {playing && (<>
                <span className="wave-ring-t" />
                <span className="wave-ring-t" style={{ animationDelay: '.5s' }} />
              </>)}
              <IconSpeaker className={`w-11 h-11 ${playing ? 'anim-pulse-soft' : ''}`} />
            </button>
            <PicOptions options={q.options} correctId={locked ? q.word.id : null} wrong={wrong} onPick={pick} />
          </div>
        )}
        {q && q.type === 'translate' && (
          <div className="bg-white rounded-[2rem] shadow-card p-5 anim-pop">
            <h2 className="text-center text-[1.6rem] font-extrabold text-ink leading-snug">Which word means this?</h2>
            <p dir="rtl" className="text-center font-ar text-lg font-bold text-softink mt-0.5">اختار الكلمة الصحيحة!</p>
            <div dir="rtl" className="font-ar text-center text-5xl font-extrabold text-ink my-4">{q.word.arabic}</div>
            <WordOptions options={q.options} correctId={locked ? q.word.id : null} wrong={wrong} onPick={pick} />
          </div>
        )}
        {q && q.type === 'complete' && (
          <div className="bg-white rounded-[2rem] shadow-card p-5 anim-pop">
            <h2 className="text-center text-[1.6rem] font-extrabold text-ink leading-snug">Complete the sentence!</h2>
            <p dir="rtl" className="text-center font-ar text-lg font-bold text-softink mt-0.5">أكمل الجملة!</p>
            <AnimalArt id={q.word.id} className="w-28 h-28 mx-auto mt-2" />
            <div className="text-2xl font-extrabold text-ink mt-3 bg-cream rounded-2xl border-2 border-[#F6EAD2] py-4 px-4 text-center">
              <SentenceBlank q={q} solved={locked} />
            </div>
            <WordOptions options={q.options} correctId={locked ? q.word.id : null} wrong={wrong} onPick={pick} />
          </div>
        )}
      </div>
      {flight && <FlyingStar flight={flight} onDone={() => {
        setFlight(null);
        if (!attempted) { scoreRef.current += 1; setScore(scoreRef.current); }
        Sfx.star();
        window.setTimeout(() => {
          if (qi + 1 < questions.length) { setQi(qi + 1); setAttempted(false); setWrong([]); setLocked(false); }
          else onFinish(scoreRef.current);
        }, 550);
      }} />}
      <ConfirmDialog open={askExit}
        title="Leave the quiz?" titleAr="مغادرة الاختبار؟"
        message="Your quiz progress will be lost." messageAr="سيتم فقدان تقدمك في الاختبار."
        primaryLabel="Keep Playing" primaryLabelAr="أكمل الاختبار"
        secondaryLabel="Leave" secondaryLabelAr="خروج"
        onPrimary={() => setAskExit(false)}
        onSecondary={() => { Speech.cancel(); onBack(); }} />
    </div>
  );
}

          </div>
          {a.badge && (
            <div className="sm:hidden flex items-center gap-1.5 bg-yellow-soft border-2 border-yellow/60 rounded-full px-3 py-1.5 mt-2 self-start">
              <IconTrophy className="w-5 h-5 text-[#C98A2D]" />
              <span className="text-xs font-extrabold text-[#A87E1C]">Animal Explorer</span>
            </div>
          )}
          <h2 className="text-xl font-extrabold text-ink mt-8">Words <span dir="rtl" className="font-ar text-base text-softink">· الكلمات</span></h2>
          <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5 mt-3">
            {words.map(w => <WordRow key={w.id} word={w} learned={a.wordsLearned.includes(w.id)} />)}
          </div>
          <h2 className="text-xl font-extrabold text-ink mt-8">Settings <span dir="rtl" className="font-ar text-base text-softink">· الإعدادات</span></h2>
          <div className="mt-3 space-y-3">
            <ToggleRow on={progress.soundOn} onToggle={onToggleSound} label="Sound & voice" labelAr="الصوت والنطق" />
            <button onClick={() => Speech.sayWordAndSentence(WORDS_ANIMALS[0])} disabled={!voiceReady}
              aria-label="Test the English voice"
              className={`w-full bg-white rounded-2xl shadow-card p-4 flex items-center justify-center gap-2 font-extrabold text-teal-dark border-2 border-[#D7EBEE] active:scale-[.98] transition-transform ${!voiceReady ? 'opacity-50' : ''}`}>
              <IconSpeaker className="w-5 h-5" /> Test the voice
              <span className="opacity-40">·</span><span dir="rtl" className="font-ar">اختبر الصوت</span>
            </button>
            <p className="text-xs font-bold text-[#B9A78F] px-1 leading-relaxed">
              Words and sentences use your device&rsquo;s built-in English voice · <span dir="rtl" className="font-ar">الصوت يعمل بمحرك النطق المدمج في الجهاز</span>
            </p>
            <button onClick={() => setAskReset(true)}
              className="w-full bg-white rounded-2xl shadow-card p-4 flex items-center justify-center gap-2 text-[#C0504A] font-extrabold border-2 border-[#F5D9D6] active:scale-[.98] transition-transform">
              <IconRefresh className="w-5 h-5" /> Reset progress <span dir="rtl" className="font-ar">إعادة تعيين التقدم</span>
            </button>
          </div>
        </>
      )}
      <ConfirmDialog open={askReset}
        title="Reset progress?" titleAr="إعادة تعيين التقدم؟"
        message="This will erase all stars, words and quiz results on this device."
        messageAr="سيتم حذف كل النجوم والكلمات ونتائج الاختبار على هذا الجهاز."
        primaryLabel="Reset" primaryLabelAr="نعم، إعادة التعيين"
        secondaryLabel="Cancel" secondaryLabelAr="إلغاء"
        onPrimary={() => { setAskReset(false); onReset(); }}
        onSecondary={() => setAskReset(false)} />
    </div>
  );
}

// ------------------- App.tsx -------------------
type Screen = 'home' | 'map' | 'lesson' | 'quiz' | 'results' | 'parent';
function App() {
  const [progress, setProgress] = useState<AppProgress>(() => progressStore.load());
  const [screen, setScreen] = useState<Screen>('home');
  const [toast, setToast] = useState<{ en: string; ar: string } | null>(null);
  const [lastQuizScore, setLastQuizScore] = useState(0);
  const toastTimer = useRef<number>(0);

  useEffect(() => { progressStore.save(progress); }, [progress]);
  useEffect(() => { Speech.init(); }, []);
  useEffect(() => { Sfx.enabled = progress.soundOn; }, [progress.soundOn]);
  useEffect(() => {
    const unlock = () => { Sfx.ensure(); };
    window.addEventListener('pointerdown', unlock, { once: true, capture: true } as any);
    return () => window.removeEventListener('pointerdown', unlock, { capture: true } as any);
  }, []);

  const showToast = useCallback((en: string, ar: string) => {
    setToast({ en, ar });
    window.clearTimeout(toastTimer.current);
    toastTimer.current = window.setTimeout(() => setToast(null), 2600);
  }, []);

  const go = useCallback((s: Screen) => {
    Speech.cancel();
    setScreen(s);
  }, []);

  const speakText = useCallback((text: string, opts?: { rate?: number }): boolean => {
    if (!progress.soundOn) { showToast('Sound is turned off', 'الصوت مغلق'); return false; }
    if (!Speech.supported) { showToast('Audio is not available on this device', 'الصوت غير متاح على هذا الجهاز'); return false; }
    return Speech.speak(text, opts);
  }, [progress.soundOn, showToast]);

  const sayWord = useCallback((word: Word): boolean => {
    if (!progress.soundOn) { showToast('Sound is turned off', 'الصوت مغلق'); return false; }
    const ok = Speech.sayWord(word);
    if (!ok) showToast('Audio is not available on this device', 'الصوت غير متاح على هذا الجهاز');
    return ok;
  }, [progress.soundOn, showToast]);

  const sayWordAndSentence = useCallback((word: Word): boolean => {
    if (!progress.soundOn) { showToast('Sound is turned off', 'الصوت مغلق'); return false; }
    const ok = Speech.sayWordAndSentence(word);
    if (!ok) showToast('Audio is not available on this device', 'الصوت غير متاح على هذا الجهاز');
    return ok;
  }, [progress.soundOn, showToast]);

  const completeWord = useCallback((wordId: string) => {
    setProgress(p => {
      const a = p.categories.animals;
      if (a.wordsLearned.includes(wordId)) return p;
      return { ...p, categories: { ...p.categories, animals: { ...a, wordsLearned: [...a.wordsLearned, wordId], lessonStars: a.lessonStars + 1 } } };
    });
  }, []);

  const finishQuiz = useCallback((score: number) => {
    setLastQuizScore(score);
    setProgress(p => {
      const a = p.categories.animals;
      const all = a.wordsLearned.length >= 10;
      return { ...p, categories: { ...p.categories, animals: { ...a, quizCompleted: true, quizBestScore: Math.max(a.quizBestScore, score), quizStars: Math.max(a.quizStars, score), badge: true, completed: all } } };
    });
    go('results');
  }, [go]);

  const resetProgress = useCallback(() => {
    Speech.cancel();
    setProgress(defaultProgress());
    showToast('Progress has been reset', 'تمت إعادة تعيين التقدم');
  }, [showToast]);

  const animals = progress.categories.animals;
  const words = WORDS_BY_CATEGORY.animals;
  const openAnimals = () => {
    if (animals.wordsLearned.length < 10) go('lesson');
    else if (!animals.quizCompleted) go('quiz');
    else go('lesson');
  };
  const homePrimary = () => {
    if (animals.wordsLearned.length < 10) go('lesson');
    else if (!animals.quizCompleted) go('quiz');
    else go('map');
  };
  const toggleSound = () => {
    if (progress.soundOn) Speech.cancel();
    setProgress(p => ({ ...p, soundOn: !p.soundOn }));
  };

  return (
    <div className="min-h-screen">
      <div key={screen} className="anim-screen min-h-screen">
        {screen === 'home' && (
          <HomeScreen progress={progress} speakText={speakText}
            onPrimary={homePrimary} onOpenCard={() => go('map')}
            onParent={() => go('parent')} onToggleSound={toggleSound} />
        )}
        {screen === 'map' && (
          <WorldMapScreen progress={progress} onBack={() => go('home')}
            onSelectAnimals={openAnimals}
            onTryLocked={() => showToast('Complete Animals to unlock the next world!', 'أكمل عالم الحيوانات لفتح العالم التالي!')}
            onTryFuture={() => showToast('Food is coming in the next adventure!', 'عالم الطعام قادم في المغامرة القادمة!')} />
        )}
        {screen === 'lesson' && (
          <LessonScreen words={words} learnedIds={animals.wordsLearned}
            quizDone={animals.quizCompleted} soundOn={progress.soundOn}
            sayWord={sayWord} sayWordAndSentence={sayWordAndSentence}
            onBack={() => go('map')} onWordComplete={completeWord}
            onFinish={target => go(target === 'quiz' ? 'quiz' : 'map')} />
        )}
        {screen === 'quiz' && (
          <QuizScreen words={words} soundOn={progress.soundOn} sayWord={sayWord}
            onBack={() => go('map')} onFinish={finishQuiz} />
        )}
        {screen === 'results' && (
          <ResultsScreen progress={progress} score={lastQuizScore}
            onMap={() => go('map')} onRequiz={() => go('quiz')} />
        )}
        {screen === 'parent' && (
          <ParentScreen progress={progress} onBack={() => go('home')}
            onReset={resetProgress} onToggleSound={toggleSound} onStart={homePrimary} />
        )}
      </div>
      <Toast toast={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root') as HTMLElement).render(<App />);
</script>
</body>
</html>
